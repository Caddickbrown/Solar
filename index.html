<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar</title>
<meta name="theme-color" content="#08080a">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": { "three": "./assets/three.module.js" } }
</script>
</head>
<body>
<canvas id="gl" aria-label="Solar system, seen from above"></canvas>
<canvas id="sky" aria-label="The sky from the ground" hidden></canvas>
<div id="tags" aria-hidden="true"></div>

<header class="mast">
  <h1 class="mark">Solar</h1>
  <button class="when" id="when" title="Jump to a date">
    <span id="dateLine">—</span>
    <span id="clock">—</span>
  </button>
  <input type="datetime-local" id="jump" tabindex="-1" aria-label="Jump to date and time">
</header>

<nav class="top-right">
  <div class="modes" role="tablist">
    <button role="tab" data-mode="system" aria-selected="true">System</button>
    <button role="tab" data-mode="sky" aria-selected="false">Sky</button>
  </div>
  <button class="place" id="btnScale">Spaced scale</button>
  <button class="place" id="place" aria-expanded="false">
    <span id="placeText">London</span>
  </button>
  <form class="place-edit" id="placeEdit" hidden>
    <label>Latitude <input type="number" id="inLat" step="0.01" min="-90" max="90"></label>
    <label>Longitude <input type="number" id="inLon" step="0.01" min="-180" max="180"></label>
    <button type="submit">Set</button>
  </form>
</nav>

<aside class="col left" id="tonight">
  <section>
    <h2>Tonight</h2>
    <p class="lede" id="nightLede">—</p>
  </section>

  <section class="moon" id="moonBlock" role="button" tabindex="0">
    <canvas id="moonGlyph" width="96" height="96"></canvas>
    <div>
      <div class="moon-name" id="moonName">—</div>
      <div class="muted" id="moonLine">—</div>
      <div class="muted" id="moonNext">—</div>
    </div>
  </section>

  <section>
    <h2>The night</h2>
    <canvas id="nightChart" height="136"></canvas>
    <p class="muted fine" id="approach"></p>
  </section>

  <section>
    <h2>Planets</h2>
    <ul class="bodies" id="bodies"></ul>
  </section>

  <section class="toggles" id="skyToggles" hidden>
    <label><input type="checkbox" id="tgLines" checked> Constellation lines</label>
    <label><input type="checkbox" id="tgNames" checked> Star names</label>
  </section>
</aside>

<aside class="col right" id="detail">
  <h2 id="dKind">Planet</h2>
  <div class="d-name" id="dName">Mars</div>
  <p class="d-sentence" id="dSentence">—</p>
  <dl class="rows" id="dRows"></dl>
  <div class="d-actions">
    <button id="btnFocus">Centre</button>
    <button id="btnOverview">Overview</button>
  </div>
</aside>

<footer class="time">
  <div class="live" id="liveState">Live</div>
  <div class="scrub">
    <input type="range" id="speed" min="-7" max="7" step="1" value="0" aria-label="Time speed">
    <div class="ticks" aria-hidden="true">
      <span style="left:0%">−100 yr/s</span>
      <span style="left:35.7%">−1 d/s</span>
      <span style="left:50%">real time</span>
      <span style="left:64.3%">+1 d/s</span>
      <span style="left:100%">+100 yr/s</span>
    </div>
  </div>
  <div class="speed" id="speedText">Real time</div>
  <button id="btnPlay">Pause</button>
  <button id="btnNow">Now</button>
</footer>

<script type="module" src="./main.js"></script>
</body>
</html>
